name: Agent Automation

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

jobs:
  route-task:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request == null

    steps:
      - name: Parse Agent Command
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"
          if echo "$COMMENT" | grep -q "@frontend-agent"; then
            echo "agent=frontend" >> $GITHUB_OUTPUT
          elif echo "$COMMENT" | grep -q "@backend-agent"; then
            echo "agent=backend" >> $GITHUB_OUTPUT
          elif echo "$COMMENT" | grep -q "@qa-agent"; then
            echo "agent=qa" >> $GITHUB_OUTPUT
          fi

      - name: Create Task Issue
        if: steps.parse.outputs.agent != ''
        uses: actions/github-script@v7
        with:
          script: |
            const agent = '${{ steps.parse.outputs.agent }}';
            const comment = context.payload.comment.body;
            const task = comment.replace(/@\w+-agent/g, '').trim();

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[${agent.toUpperCase()}] ${task}`,
              body: `Task assigned to ${agent} agent\n\nOriginal comment: ${comment}\n\nCreated by: @${context.payload.comment.user.login}`,
              labels: [`agent-${agent}`, 'task']
            });

  auto-merge:
    if: github.actor == 'agent-pr-bot'
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge Agent PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Check if all checks passed
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha
            });

            const allPassed = checks.data.check_runs.every(
              check => check.conclusion === 'success'
            );

            if (allPassed) {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });
            }
